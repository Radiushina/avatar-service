services:
  postgres:
    image: postgres:16.3
    environment:
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: avatars
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U developer -d avatars"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - network

  adminer:
    image: adminer:5
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - network

  rabbitmq:
    image: rabbitmq:3-alpine
    environment:
      RABBITMQ_DEFAULT_USER: avatars
      RABBITMQ_DEFAULT_PASS: avatars
    ports:
      - "5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - network

  minio:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        minio server /data --console-address ":9003" &
        pid=$$!
        trap 'kill -TERM $$pid' TERM INT
        until mc alias set local http://127.0.0.1:9000 minio "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing local/avatars; do
          sleep 1
        done
        wait $$pid
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "stat", "local/avatars"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - network

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    ports:
      - "8080:8080"
    environment:
      SERVER_HTTP_ADDRESS: ":8080"
      DATABASE_DSN: postgres://developer:${POSTGRES_PASSWORD}@postgres:5432/avatars?sslmode=disable
      LOG_LEVEL: info
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: avatars
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      RABBITMQ_URL: amqp://avatars:avatars@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    command: ["./worker"]
    environment:
      DATABASE_DSN: postgres://developer:${POSTGRES_PASSWORD}@postgres:5432/avatars?sslmode=disable
      LOG_LEVEL: info
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: avatars
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      RABBITMQ_URL: amqp://avatars:avatars@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - network

volumes:
  postgres_data:
  minio_data:

networks:
  network:
    driver: bridge
