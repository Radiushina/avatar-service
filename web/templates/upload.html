<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Avatar</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body class="min-h-screen bg-slate-100">
<div class="container mx-auto px-4 py-10 max-w-xl">
    <div class="bg-white rounded-xl shadow border border-slate-200 overflow-hidden">
        <header class="bg-slate-900 px-6 py-5">
            <h1 class="text-2xl font-semibold text-white">Upload avatar</h1>
            <p class="text-slate-300 text-sm mt-1">JPEG, PNG or WebP · max 10MB</p>
        </header>
        <main class="p-6 space-y-4">
            {{if .Error}}
            <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">{{.Error}}</div>
            {{end}}
            <form method="post" action="/web/upload" enctype="multipart/form-data" class="space-y-4">
                <div>
                    <label for="user_id" class="block text-sm font-medium text-slate-700 mb-1">User ID</label>
                    <input id="user_id" name="user_id" type="text" required value="{{.UserID}}"
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-500">
                </div>
                <div>
                    <label for="file" class="block text-sm font-medium text-slate-700 mb-1">Image</label>
                    <input id="file" name="file" type="file" accept="image/jpeg,image/png,image/webp" required
                           class="w-full text-sm text-slate-600">
                </div>
                <button type="submit"
                        class="w-full bg-slate-900 text-white font-medium py-2.5 rounded-lg hover:bg-slate-800">
                    Upload
                </button>
            </form>
        </main>
    </div>
</div>
</body>
</html>
