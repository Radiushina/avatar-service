apiVersion: apps/v1
kind: Deployment
metadata:
  name: avatar-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: avatar-service
  template:
    metadata:
      labels:
        app: avatar-service
    spec:
      serviceAccountName: avatar-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        # Группа для томов. Сейчас томов нет, поле нужно для PodSecurityPolicy fsGroup.
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: avatar-service:0.1.0
          securityContext:
            # Процесс не может получить больше прав, чем выдано при старте.
            allowPrivilegeEscalation: false
            # Запись в файлы образа запрещена. Логи идут в stdout, шаблоны только читаются.
            readOnlyRootFilesystem: true
            # Сбросить CAP_NET_RAW и остальные capabilities.
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: avatar-secrets
                  key: database-url
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5