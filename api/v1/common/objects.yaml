SuccessUploadAvatar:
  type: object
  required: [id, user_id, url, status, created_at ]
  properties:
    id:
      description: 'Avatar ID'
      type: string
      format: uuid
      example: 1ca79251-f6e3-45a4-992f-404f6e4e13ed
    user_id:
      description: 'User ID'
      type: string
      format: uuid
      example: user-123
    url:
      description: 'Link to download the avatar'
      type: string
      example: https://avatars-service/1ca79251-f6e3-45a4-992f-404f6e4e13ed/avatar
    status:
      description: 'Status'
      type: string
      enum: [processing]
    created_at:
      description: 'Creation date'
      type: string
      format: date-time
      example: "2024-01-01T00:00:00Z"

AvatarMetadata:
  type: object
  required:
    - id
    - user_id
    - file_name
    - mime_type
    - size
    - dimensions
    - thumbnails
    - created_at
    - updated_at
  properties:
    id:
      type: string
      format: uuid
    user_id:
      type: string
    file_name:
      type: string
      example: avatar.jpg
    mime_type:
      type: string
      enum: [image/jpeg, image/png, image/webp]
      example: image/jpeg
    size:
      type: integer
      description: File size in bytes
      example: 1024000
    dimensions:
      $ref: '#/AvatarDimensions'
    thumbnails:
      type: array
      items:
        $ref: '#/AvatarThumbnail'
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

AvatarDimensions:
  type: object
  required: [width, height]
  properties:
    width:
      type: integer
      example: 1920
    height:
      type: integer
      example: 1080

AvatarThumbnail:
  type: object
  required: [size, url]
  properties:
    size:
      type: string
      enum: ["100x100", "300x300"]
    url:
      type: string
      format: uri

